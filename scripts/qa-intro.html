<!doctype html><meta charset="utf-8"><title>QA intro théâtre</title>
<style>body{background:#151822;color:#eee;font:14px system-ui;margin:12px}button,select{padding:8px;margin:3px}iframe{border:0;display:block}pre{white-space:pre-wrap;max-width:1100px;max-height:130px;overflow:auto}</style>
<h1>QA intro théâtre</h1><label>Taille <select id="size"><option>390x844</option><option>320x568</option><option>568x320</option><option>1180x757</option><option>430x932</option></select></label>
<button id="run">Tester les trois actes</button><button id="reduced">Tester effets réduits</button><button id="baseline">Mesurer sans théâtre</button><button id="motion">Mesurer avec théâtre</button><button id="paired">Comparer 3 paires</button>
<pre id="report">Prêt</pre><iframe id="game" width="390" height="844" src="index.html"></iframe>
<script type="module">
const frame=document.querySelector('#game'),report=document.querySelector('#report');
const wait=ms=>new Promise(r=>setTimeout(r,ms));const raf=w=>new Promise(r=>w.requestAnimationFrame(r));
function measure(d){const text=d.querySelector('#dialogue-text'),button=d.querySelector('#next-dialogue'),root=d.querySelector('#dialogue'),pic=d.querySelector('#encounter-framed-portrait'),w=d.defaultView;return{stage:root.className,text:text.textContent,height:text.clientHeight,scroll:text.scrollHeight,opacity:w.getComputedStyle(text).opacity,textAnimation:w.getComputedStyle(text).animationName,buttonAnimation:w.getComputedStyle(button).animationName,buttonDisabled:button.disabled,buttonBottom:button.getBoundingClientRect().bottom,viewport:w.innerHeight,portraitHidden:pic.hidden,portraitAnimation:w.getComputedStyle(pic).animationName,lightAnimation:w.getComputedStyle(root,'::after').animationName,lightOpacity:w.getComputedStyle(root,'::after').opacity,lightPointer:w.getComputedStyle(root,'::after').pointerEvents};}
function menu(d){if(!d.querySelector('#dialogue').classList.contains('hidden'))d.querySelector('#skip-dialogue').click();}
async function run(reduced){const d=frame.contentDocument;frame.contentWindow.focus();menu(d);await wait(250);d.querySelector('#app').classList.toggle('reduced-fx',reduced);const rows=[];d.querySelector('#story').click();for(let i=0;i<3;i++){rows.push(measure(d));await wait(550);rows[i].settled=measure(d);if(i<2)d.querySelector('#next-dialogue').click();}report.textContent=JSON.stringify({reduced,systemReduced:frame.contentWindow.matchMedia('(prefers-reduced-motion: reduce)').matches,rows},null,2);}
async function perf(disabled){const d=frame.contentDocument,w=frame.contentWindow;frame.contentWindow.focus();menu(d);await wait(250);d.querySelector('#app').classList.remove('reduced-fx');let style=d.querySelector('#qa-disable-motion');if(!style){style=d.createElement('style');style.id='qa-disable-motion';style.textContent='.opening::after{content:none!important}.opening #encounter-framed-portrait{animation:none!important}';d.head.append(style);}style.disabled=!disabled;let intervals=[],last,hiddenFrames=0;const collect=t=>{if(d.hidden)hiddenFrames++;if(last!==undefined)intervals.push(t-last);last=t;if(intervals.length<180)w.requestAnimationFrame(collect);};w.requestAnimationFrame(collect);d.querySelector('#story').click();await wait(650);d.querySelector('#next-dialogue').click();await wait(650);d.querySelector('#next-dialogue').click();while(intervals.length<180)await wait(100);intervals.sort((a,b)=>a-b);const result={disabled,hiddenFrames,count:intervals.length,mean:intervals.reduce((a,b)=>a+b,0)/intervals.length,p50:intervals[90],p95:intervals[171],max:intervals.at(-1),over33ms:intervals.filter(x=>x>33.4).length};report.textContent=JSON.stringify(result,null,2);style.disabled=true;return result;}
document.querySelector('#paired').onclick=async()=>{const pairs=[];for(let i=0;i<3;i++){pairs.push(await perf(i%2===0),await perf(i%2!==0));}report.textContent=JSON.stringify({pairs},null,2);};
document.querySelector('#size').onchange=e=>{const[w,h]=e.target.value.split('x');frame.width=w;frame.height=h;};
document.querySelector('#run').onclick=()=>run(false);document.querySelector('#reduced').onclick=()=>run(true);document.querySelector('#baseline').onclick=()=>perf(true);document.querySelector('#motion').onclick=()=>perf(false);
</script>
